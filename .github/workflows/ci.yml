name: AI Guardrail Gateway CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    name: Lint & Security Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit
          pip install -r requirements.txt

      - name: Syntax & Compilation Check
        run: |
          python -m compileall -q backend frontend tests

      - name: Flake8 Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend frontend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 backend frontend tests --count --exit-zero --max-complexity=15 --max-line-length=140 --statistics

      - name: Bandit Security AST Audit
        run: |
          bandit -r backend -ll -ii --exclude "backend/database/*.db"

  test-suite:
    name: Guardrail & E-Commerce Automated Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dynamic Threat Intel Tests
        run: |
          python tests/threat_intel_test.py

      - name: Run E-Commerce & BOLA Defense Tests
        run: |
          python tests/shop_business_test.py

      - name: Run 200 E2E Guardrail Benchmark Suite (VAL-001 ~ VAL-004)
        run: |
          python tests/benchmark_test.py

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-security, test-suite]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ai-guardrail-gateway:ci-test
