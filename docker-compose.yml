version: '3.8'

services:
  backend:
    build:
      context: .
      file: backend/Dockerfile
    container_name: ai-guardrail-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - ALLOW_DEMO_BYPASS=false
      - ADMIN_API_KEY=secret-admin-key-2026
      - OLLAMA_URL=http://host.docker.internal:11434
      - AUDIT_LOG_RAW_CONTENT=false
    volumes:
      - sqlite_data:/app/backend/database
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; exit(0 if urllib.request.urlopen(\"http://localhost:8000/api/v1/health\").getcode() == 200 else 1)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - guardrail-net

  frontend:
    build:
      context: .
      file: frontend/Dockerfile
    container_name: ai-guardrail-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
      - ADMIN_API_KEY=secret-admin-key-2026
      - ALLOW_DEMO_BYPASS=false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - guardrail-net

volumes:
  sqlite_data:
    driver: local

networks:
  guardrail-net:
    driver: bridge
