services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8501}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env before starting}
      ALLOW_DEMO_BYPASS: "false"
      AUDIT_LOG_RAW_CONTENT: ${AUDIT_LOG_RAW_CONTENT:-false}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit-data:/app/backend/database
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env before starting}
      ALLOW_DEMO_BYPASS: "false"
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

volumes:
  audit-data:
